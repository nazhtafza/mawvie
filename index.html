<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>THANKS FOR LAST WEEKEND MAWLL 🤍</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤍</text></svg>">
  <meta name="description" content="THANKS FOR LAST WEEKEND MAWLL 🤍 - Mawvie">

  <!-- Google Fonts for Theater Styling -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Fullscreen ASCII Canvas */
    canvas#screen {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: pointer;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* ====================================================================
       THEATER CURTAIN OVERLAY (Start closed, opens left & right)
       ==================================================================== */
    .curtain-experience-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 50;
      overflow: hidden;
      background-color: #0e0605;
      cursor: pointer;
      transition: visibility 0s 1.8s, opacity 0.5s 1.5s;
    }

    /* Top Valance Arch */
    .curtain-top-valance {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      z-index: 20;
      pointer-events: none;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.7));
      transition: transform 1.5s ease-out, opacity 1.2s ease-out;
    }
    .curtain-top-valance .valance-img {
      width: 100%;
      display: block;
      height: auto;
      max-height: 130px;
      object-fit: cover;
    }

    /* Left & Right Curtain Panels */
    .curtain-curtain-panel {
      position: absolute;
      top: 0;
      bottom: 0;
      height: 100%;
      width: 52%;
      z-index: 10;
      overflow: hidden;
      will-change: transform;
    }

    .curtain-panel-left {
      left: 0;
      transform-origin: left top;
      box-shadow: 12px 0 30px rgba(0, 0, 0, 0.75);
      transition: transform 1.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .curtain-panel-right {
      right: 0;
      transform-origin: right top;
      box-shadow: -12px 0 30px rgba(0, 0, 0, 0.75);
      transition: transform 1.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .curtain-panel-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Bottom Wood Stage Floor */
    .curtain-bottom-floor {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      z-index: 15;
      pointer-events: none;
      transition: transform 1.5s ease-out, opacity 1.2s ease-out;
    }
    .curtain-bottom-floor .floor-img {
      width: 100%;
      display: block;
      height: 55px;
      object-fit: cover;
    }

    /* CURTAIN OPENED STATE */
    .curtain-experience-overlay.curtain-opened {
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
    }
    .curtain-experience-overlay.curtain-opened .curtain-panel-left {
      transform: translateX(-102%) scaleX(0.25);
    }
    .curtain-experience-overlay.curtain-opened .curtain-panel-right {
      transform: translateX(102%) scaleX(0.25);
    }
    .curtain-experience-overlay.curtain-opened .curtain-top-valance {
      transform: translateY(-100%);
      opacity: 0;
    }
    .curtain-experience-overlay.curtain-opened .curtain-bottom-floor {
      transform: translateY(50px);
      opacity: 0;
    }

    /* Floating Sound Control Button (Hidden during curtain, fades in after opening) */
    .music-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 99;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease, transform 0.25s ease, background 0.25s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    .music-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .music-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.08);
      border-color: rgba(255, 255, 255, 0.45);
    }
    .music-btn:active {
      transform: scale(0.95);
    }
    .music-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <!-- Background Audio: Bee Gees - How Deep Is Your Love -->
  <audio id="bgMusic" src="assets/how_deep_is_your_love.mp3" preload="auto" loop playsinline></audio>

  <!-- ====================================================================
       THEATER CURTAIN OVERLAY (Start closed, opens left & right)
       ==================================================================== -->
  <div class="curtain-experience-overlay" id="curtainOverlay">
    <!-- Top Proscenium Valance Arch -->
    <div class="curtain-top-valance">
      <img src="assets/curtain_valance.png" alt="Curtain Valance" class="valance-img">
    </div>

    <!-- Left Velvet Curtain Panel -->
    <div class="curtain-curtain-panel curtain-panel-left" id="curtainLeftPanel">
      <img src="assets/curtain_left.png" alt="Tirai Kiri" class="curtain-panel-img">
    </div>

    <!-- Right Velvet Curtain Panel -->
    <div class="curtain-curtain-panel curtain-panel-right" id="curtainRightPanel">
      <img src="assets/curtain_right.png" alt="Tirai Kanan" class="curtain-panel-img">
    </div>

    <!-- Bottom Stage Wood Floor of Curtain -->
    <div class="curtain-bottom-floor">
      <img src="assets/stage_wood_floor.png" alt="Stage Floor" class="floor-img">
    </div>
  </div>

  <!-- ASCII Canvas (Stage Content behind Curtain) -->
  <canvas id="screen"></canvas>

  <!-- Floating Audio Toggle -->
  <button class="music-btn" id="musicToggle" type="button" aria-label="Toggle background music" title="Play / Pause Music">
    <svg id="iconMuted" viewBox="0 0 24 24">
      <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
    </svg>
    <svg id="iconPlaying" viewBox="0 0 24 24" style="display: none;">
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
  </button>

  <script src="bouquet.js"></script>
  <script>
    (() => {
      const audio = document.getElementById('bgMusic');
      const btn = document.getElementById('musicToggle');
      const iconMuted = document.getElementById('iconMuted');
      const iconPlaying = document.getElementById('iconPlaying');
      const curtainOverlay = document.getElementById('curtainOverlay');
      let curtainOpened = false;

      function updateUI(playing) {
        if (playing) {
          iconMuted.style.display = 'none';
          iconPlaying.style.display = 'block';
          btn.style.background = 'rgba(255, 255, 255, 0.25)';
        } else {
          iconMuted.style.display = 'block';
          iconPlaying.style.display = 'none';
          btn.style.background = 'rgba(255, 255, 255, 0.1)';
        }
      }

      function togglePlay() {
        if (!audio) return;
        if (audio.paused) {
          audio.volume = 0.85;
          audio.play().then(() => updateUI(true)).catch(e => console.log('Audio play error:', e));
        } else {
          audio.pause();
          updateUI(false);
        }
      }

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        togglePlay();
      });

      // Curtain opening sequence:
      function triggerCurtainOpening() {
        if (curtainOpened) return;
        curtainOpened = true;

        if (curtainOverlay) {
          curtainOverlay.classList.add('curtain-opened');
          curtainOverlay.style.pointerEvents = 'none';
          setTimeout(() => {
            curtainOverlay.style.display = 'none';
          }, 1800);
        }

        // Start background audio smoothly
        if (audio && audio.paused) {
          audio.volume = 0.85;
          audio.play().then(() => updateUI(true)).catch(e => console.log('Audio autoplay prevented:', e));
        }

        // Fade in floating music button after curtain opening
        setTimeout(() => {
          if (btn) btn.classList.add('visible');
        }, 1200);

        // Start flower bloom as curtains part
        setTimeout(() => {
          if (typeof window.startBloom === 'function') {
            window.startBloom();
          }
        }, 500);
      }

      // Tap on closed curtain to open immediately
      if (curtainOverlay) {
        curtainOverlay.addEventListener('click', triggerCurtainOpening);
      }

      // Auto-open smoothly after 1.2s if not tapped
      const q = new URLSearchParams(window.location.search);
      if (q.has('t')) {
        // If testing with ?t=..., open immediately
        triggerCurtainOpening();
      } else {
        setTimeout(() => {
          if (!curtainOpened) {
            triggerCurtainOpening();
          }
        }, 1200);
      }
    })();
  </script>
</body>
</html>
